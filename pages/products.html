<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Products</title>
    <style>
      :root {
        --bg-a: #f8f6f2;
        --bg-b: #ebe5da;
        --ink-900: #17161a;
        --ink-700: #3d3944;
        --ink-500: #6f6879;
        --card: rgba(255, 255, 255, 0.78);
        --card-border: rgba(145, 129, 108, 0.22);
        --accent: #2e7a4f;
        --accent-soft: #d7efe1;
        --shadow: 0 16px 38px rgba(36, 28, 18, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px 18px;
        background: radial-gradient(circle at 16% 18%, #fffdf8 0%, transparent 42%),
          radial-gradient(circle at 90% 84%, #f0e7d4 0%, transparent 38%),
          linear-gradient(140deg, var(--bg-a), var(--bg-b));
        color: var(--ink-900);
        font-family: "Avenir Next", "Century Gothic", "Segoe UI", sans-serif;
      }

      .shell {
        width: min(760px, 100%);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        background: linear-gradient(165deg, rgba(255, 255, 255, 0.9), var(--card));
        box-shadow: var(--shadow);
        backdrop-filter: blur(6px);
        padding: clamp(20px, 3vw, 34px);
        position: relative;
        overflow: hidden;
      }

      .shell::before {
        content: "";
        position: absolute;
        inset: -140px -80px auto auto;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(227, 199, 162, 0.34), transparent 72%);
        pointer-events: none;
      }

      h1 {
        margin: 0;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-size: clamp(1.25rem, 3.4vw, 1.8rem);
        font-weight: 650;
        color: var(--ink-900);
      }

      .subtitle {
        margin: 8px 0 18px;
        color: var(--ink-500);
        font-size: 0.96rem;
      }

      #products {
        display: grid;
        gap: 10px;
      }

      .status {
        margin: 6px 0;
        color: var(--ink-700);
        font-size: 0.95rem;
      }

      .product {
        padding: 14px 16px;
        background: linear-gradient(180deg, #ffffff, #f8f6f1);
        border-radius: 12px;
        border: 1px solid rgba(129, 117, 96, 0.22);
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 18px;
        animation: rise-in 420ms ease-out both;
        animation-delay: calc(var(--i, 0) * 70ms);
      }

      .product:hover {
        border-color: rgba(85, 128, 98, 0.48);
        transform: translateY(-1px);
        transition: transform 180ms ease, border-color 180ms ease;
      }

      .product .name {
        font-weight: 600;
        color: var(--ink-900);
        letter-spacing: 0.01em;
      }

      .product .price {
        color: var(--accent);
        background: var(--accent-soft);
        border: 1px solid rgba(46, 122, 79, 0.26);
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 0.93rem;
        font-weight: 600;
        white-space: nowrap;
      }

      @keyframes rise-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 560px) {
        body {
          padding: 16px;
        }

        .shell {
          border-radius: 16px;
          padding: 18px;
        }

        .product {
          padding: 12px;
          flex-wrap: wrap;
          row-gap: 8px;
        }

        .product .price {
          margin-left: auto;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body>
    <main class="shell">
      <h1>Product List</h1>
      <p class="subtitle">Mock-ready catalog for API testing workflows.</p>
      <div id="products"><p class="status">Loading...</p></div>
    </main>

    <script>
      async function loadProducts() {
        try {
          const res = await axios.get("/api/products");
          const products = Array.isArray(res.data.products) ? res.data.products : [];
          const container = document.getElementById("products");
          container.innerHTML = products
            .map(
              (p, index) => `<div class="product" style="--i:${index}">
            <span class="name">${p.name}</span>
            <span class="price">${Number(p.price).toLocaleString()} LKR</span>
          </div>`,
            )
            .join("");

          if (!products.length) {
            container.innerHTML = '<p class="status">No products available right now.</p>';
          }
        } catch (err) {
          document.getElementById("products").textContent =
            "Failed to load products.";
        }
      }

      loadProducts();
    </script>
  </body>
</html>
